<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>転職学習助手</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0f13;
    --bg2: #17171e;
    --bg3: #1e1e28;
    --bg4: #252532;
    --accent: #7c6ff7;
    --accent2: #a89af7;
    --accent3: #c4bcff;
    --text: #e8e6ff;
    --text2: #9b98be;
    --text3: #6b6890;
    --border: #2e2e3e;
    --highlight: rgba(124, 111, 247, 0.25);
    --highlight-active: rgba(168, 154, 247, 0.4);
    --success: #4ade80;
    --font-main: 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  }
  body { background: var(--bg); color: var(--text); font-family: var(--font-main); min-height: 100vh; }

  .app { display: grid; grid-template-columns: 260px 1fr 320px; grid-template-rows: 56px 1fr; height: 100vh; }
  .header { grid-column: 1/-1; background: var(--bg2); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px; padding: 0 20px; }
  .sidebar { background: var(--bg2); border-right: 1px solid var(--border); overflow-y: auto; padding: 16px; }
  .main { overflow-y: auto; padding: 24px; }
  .chat-panel { background: var(--bg2); border-left: 1px solid var(--border); display: flex; flex-direction: column; }

  .logo { font-size: 15px; font-weight: 700; color: var(--accent3); letter-spacing: 0.05em; }
  .logo span { color: var(--text2); font-weight: 400; }
  .mode-tabs { display: flex; gap: 4px; margin-left: auto; }
  .mode-tab { padding: 6px 14px; border-radius: 6px; font-size: 13px; cursor: pointer; border: 1px solid transparent; color: var(--text2); transition: all 0.2s; background: transparent; }
  .mode-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .mode-tab:hover:not(.active) { background: var(--bg3); color: var(--text); }

  .sidebar-title { font-size: 11px; font-weight: 600; color: var(--text3); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 10px; }
  .article-list { display: flex; flex-direction: column; gap: 6px; }
  .article-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; transition: all 0.2s; }
  .article-item:hover { background: var(--bg3); }
  .article-item.active { background: var(--bg3); border-color: var(--accent); }
  .article-item-title { font-size: 13px; font-weight: 500; color: var(--text); line-height: 1.4; }
  .article-item-meta { font-size: 11px; color: var(--text3); margin-top: 3px; }
  .article-badge { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 10px; font-weight: 600; margin-right: 4px; }
  .badge-interview { background: rgba(124,111,247,0.2); color: var(--accent2); }
  .badge-news { background: rgba(74,222,128,0.15); color: #86efac; }
  .badge-analysis { background: rgba(251,146,60,0.15); color: #fdba74; }

  .article-header { margin-bottom: 24px; }
  .article-tag { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; background: rgba(124,111,247,0.15); border: 1px solid rgba(124,111,247,0.3); border-radius: 20px; font-size: 12px; color: var(--accent2); margin-bottom: 12px; }
  .article-title { font-size: 22px; font-weight: 700; line-height: 1.4; color: var(--text); margin-bottom: 8px; }
  .article-subtitle { font-size: 14px; color: var(--text2); margin-bottom: 16px; }
  .article-meta { display: flex; gap: 16px; font-size: 12px; color: var(--text3); }

  .player { background: var(--bg3); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; margin-bottom: 24px; display: flex; flex-direction: column; gap: 12px; }
  .player-row { display: flex; align-items: center; gap: 12px; }
  .btn-play { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); border: none; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; transition: all 0.2s; flex-shrink: 0; }
  .btn-play:hover { background: var(--accent2); transform: scale(1.05); }
  .btn-icon { width: 32px; height: 32px; border-radius: 6px; background: transparent; border: 1px solid var(--border); color: var(--text2); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; transition: all 0.2s; flex-shrink: 0; }
  .btn-icon:hover { background: var(--bg4); color: var(--text); }
  .progress-wrap { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .progress-bar { width: 100%; height: 4px; background: var(--bg4); border-radius: 2px; cursor: pointer; appearance: none; -webkit-appearance: none; }
  .progress-bar::-webkit-slider-thumb { appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
  .progress-bar::-webkit-slider-runnable-track { background: linear-gradient(to right, var(--accent) var(--pct, 0%), var(--bg4) var(--pct, 0%)); height: 4px; border-radius: 2px; }
  .time-row { display: flex; justify-content: space-between; font-size: 11px; color: var(--text3); }
  .speed-btn { padding: 3px 8px; border-radius: 4px; border: 1px solid var(--border); background: transparent; color: var(--text2); font-size: 12px; cursor: pointer; transition: all 0.2s; }
  .speed-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .section-nav { display: flex; gap: 6px; flex-wrap: wrap; }
  .section-chip { padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border); font-size: 12px; color: var(--text2); cursor: pointer; transition: all 0.2s; }
  .section-chip:hover { border-color: var(--accent); color: var(--accent2); }
  .section-chip.active { background: rgba(124,111,247,0.2); border-color: var(--accent); color: var(--accent2); }

  .article-body { font-size: 15px; line-height: 2; color: var(--text2); }
  .sentence { cursor: pointer; border-radius: 4px; padding: 0 2px; transition: all 0.2s; display: inline; }
  .sentence:hover { background: rgba(124,111,247,0.15); color: var(--text); }
  .sentence.reading { background: var(--highlight-active); color: var(--text); }
  .sentence.read { background: rgba(124,111,247,0.08); color: var(--text); }
  .sentence.selected { background: rgba(168,154,247,0.3); color: var(--text); outline: 1px solid var(--accent); }
  p { margin-bottom: 16px; }
  .section-header { font-size: 17px; font-weight: 700; color: var(--text); margin: 28px 0 12px; padding-left: 12px; border-left: 3px solid var(--accent); }

  .chat-header { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
  .chat-mode-selector { display: flex; gap: 4px; flex: 1; }
  .chat-mode-btn { flex: 1; padding: 5px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--text2); font-size: 12px; cursor: pointer; transition: all 0.2s; }
  .chat-mode-btn.active { background: rgba(124,111,247,0.2); border-color: var(--accent); color: var(--accent2); }
  .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 100%; display: flex; flex-direction: column; gap: 4px; }
  .msg.user { align-items: flex-end; }
  .msg.ai { align-items: flex-start; }
  .msg-bubble { padding: 10px 14px; border-radius: 12px; font-size: 13px; line-height: 1.6; max-width: 90%; }
  .msg.user .msg-bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .msg.ai .msg-bubble { background: var(--bg3); color: var(--text); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg-role { font-size: 11px; color: var(--text3); }
  .chat-input-area { padding: 12px; border-top: 1px solid var(--border); }
  .chat-input-row { display: flex; gap: 8px; align-items: flex-end; }
  .chat-input { flex: 1; background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; color: var(--text); font-size: 13px; resize: none; font-family: var(--font-main); line-height: 1.5; min-height: 40px; max-height: 120px; }
  .chat-input:focus { outline: none; border-color: var(--accent); }
  .btn-send { width: 36px; height: 36px; border-radius: 8px; background: var(--accent); border: none; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; transition: all 0.2s; flex-shrink: 0; }
  .btn-send:hover { background: var(--accent2); }
  .btn-send:disabled { opacity: 0.4; cursor: not-allowed; }
  .role-info { padding: 8px 12px; margin-bottom: 8px; background: rgba(124,111,247,0.1); border-radius: 8px; font-size: 12px; color: var(--accent2); border: 1px solid rgba(124,111,247,0.2); }
  .tts-status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text3); }
  .tts-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text3); }
  .tts-dot.active { background: var(--success); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .vocab-panel { background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 20px; }
  .vocab-title { font-size: 12px; color: var(--text3); margin-bottom: 8px; font-weight: 600; letter-spacing: 0.05em; }
  .vocab-item { display: flex; align-items: baseline; gap: 8px; padding: 4px 0; border-bottom: 1px solid rgba(46,46,62,0.5); flex-wrap: wrap; }
  .vocab-item:last-child { border-bottom: none; }
  .vocab-jp { font-size: 14px; font-weight: 600; color: var(--accent2); }
  .vocab-reading { font-size: 12px; color: var(--text3); }
  .vocab-def { font-size: 13px; color: var(--text2); }
  .loading-dots::after { content: '·'; animation: dots 1.2s infinite; }
  @keyframes dots { 0%{content:'·'} 33%{content:'··'} 66%{content:'···'} }

  /* API key setup */
  .setup-banner { display: flex; align-items: center; gap: 10px; padding: 8px 16px; background: rgba(251,146,60,0.1); border-bottom: 1px solid rgba(251,146,60,0.2); font-size: 12px; color: #fdba74; }
  .setup-banner input { flex: 1; background: var(--bg3); border: 1px solid rgba(251,146,60,0.3); border-radius: 6px; padding: 4px 8px; color: var(--text); font-size: 12px; font-family: monospace; }
  .setup-banner button { padding: 4px 10px; border-radius: 5px; border: none; background: rgba(251,146,60,0.3); color: #fdba74; cursor: pointer; font-size: 12px; }
</style>
</head>
<body>
<div class="app">
  <!-- Header -->
  <div class="header" style="flex-direction:column;align-items:stretch;justify-content:center;gap:6px;padding:8px 20px;">
    <div style="display:flex;align-items:center;gap:16px;">
      <div class="logo">転職<span>学習助手</span></div>
      <div class="tts-status">
        <div class="tts-dot" id="tts-dot"></div>
        <span id="tts-label">音声読み上げ</span>
      </div>
      <div class="mode-tabs" style="margin-left:auto">
        <button class="mode-tab active" id="tab-read">📖 精読</button>
        <button class="mode-tab" id="tab-quiz">🎯 面試</button>
      </div>
    </div>
    <!-- API Key row -->
    <div class="setup-banner" id="api-banner">
      <span>🔑 Anthropic API Key:</span>
      <input type="password" id="api-key-input" placeholder="sk-ant-..." />
      <button onclick="saveKey()">保存</button>
      <span id="key-status" style="color:var(--success);display:none">✓ 保存済み</span>
    </div>
  </div>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-title">記事リスト</div>
    <div class="article-list" id="article-list"></div>
  </div>

  <!-- Main -->
  <div class="main" id="main-content">
    <div class="article-header">
      <div class="article-tag" id="article-tag">📰 記事</div>
      <div class="article-title" id="article-title">記事を選んでください</div>
      <div class="article-subtitle" id="article-subtitle"></div>
      <div class="article-meta" id="article-meta"></div>
    </div>
    <div class="player">
      <div class="player-row">
        <button class="btn-play" id="play-btn" onclick="togglePlay()">▶</button>
        <button class="btn-icon" onclick="prevSentence()">⏮</button>
        <button class="btn-icon" onclick="nextSentence()">⏭</button>
        <div class="progress-wrap">
          <input type="range" class="progress-bar" id="progress" min="0" max="100" value="0" oninput="seekTo(this.value)" style="--pct:0%">
          <div class="time-row">
            <span id="time-current">0 / 0 文</span>
            <span id="time-total"></span>
          </div>
        </div>
        <div style="display:flex;gap:4px">
          <button class="speed-btn" onclick="setSpeed(0.75)" data-speed="0.75">0.75x</button>
          <button class="speed-btn active" onclick="setSpeed(1)" data-speed="1">1x</button>
          <button class="speed-btn" onclick="setSpeed(1.25)" data-speed="1.25">1.25x</button>
        </div>
      </div>
      <div class="section-nav" id="section-nav"></div>
    </div>
    <div class="vocab-panel" id="vocab-panel" style="display:none">
      <div class="vocab-title">🔑 キーワード</div>
      <div id="vocab-items"></div>
    </div>
    <div class="article-body" id="article-body">
      <p style="color:var(--text3);font-style:italic">左のリストから記事を選んでください。</p>
    </div>
  </div>

  <!-- Chat -->
  <div class="chat-panel">
    <div class="chat-header">
      <div class="chat-mode-selector">
        <button class="chat-mode-btn active" onclick="setChatMode('qa')" id="cm-qa">Q&A</button>
        <button class="chat-mode-btn" onclick="setChatMode('roleplay')" id="cm-roleplay">面接RP</button>
        <button class="chat-mode-btn" onclick="setChatMode('explain')" id="cm-explain">解説</button>
      </div>
    </div>
    <div class="chat-messages" id="chat-messages">
      <div class="msg ai">
        <div class="msg-role">AI アシスタント</div>
        <div class="msg-bubble">こんにちは！まず上のバーにAnthropicのAPI Keyを入力してください。記事を選んで音声再生 → AI対話で学習を深めましょう！</div>
      </div>
    </div>
    <div class="chat-input-area">
      <div class="role-info" id="role-info" style="display:none"></div>
      <div class="chat-input-row">
        <textarea class="chat-input" id="chat-input" placeholder="質問を入力... (Enter送信)" rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="btn-send" id="send-btn" onclick="sendMessage()">➤</button>
      </div>
    </div>
  </div>
</div>

<script>
// ===== ARTICLES DATA =====
const ARTICLES = [
  {
    id:1, tag:'インタビュー', badgeClass:'badge-interview',
    title:'テクノロジー企業のDX戦略：CTOが語るAI活用の現実と課題',
    subtitle:'SaaS企業のデジタル変革を牽引するリーダーへの独占インタビュー',
    meta:{source:'Tech Business Review', date:'2024年3月', readTime:'約8分'},
    vocab:[
      {jp:'DX（デジタルトランスフォーメーション）', reading:'ディーエックス', def:'企業がデジタル技術を活用してビジネスモデルを変革すること'},
      {jp:'技術的負債', reading:'ぎじゅつてきふさい', def:'短期的な開発速度を優先した結果、後から解消が必要になるコストのこと'},
      {jp:'スケーラビリティ', reading:'すけーらびりてぃ', def:'システムやビジネスが成長に応じて拡張できる能力'},
    ],
    sections:['会社概要','AI戦略','課題と解決策','採用について'],
    content:[
      {type:'section',text:'会社概要と現在の取り組み'},
      {type:'p',sentences:['当社は創業から10年で、従業員数500名を超えるSaaS企業に成長しました。','私がCTOに就任した当初、システムの多くはレガシーな構成で、スケーラビリティに大きな課題を抱えていました。','その課題を解決するため、まずクラウドネイティブへの移行を最優先事項として掲げました。']},
      {type:'section',text:'AI活用の現実'},
      {type:'p',sentences:['AI導入において最も重要なのは、技術そのものではなく、組織の文化変革だと実感しています。','どんなに優れたAIツールを導入しても、社員がその価値を理解し、日常業務に統合できなければ意味がありません。','私たちはまず、小さな成功体験を積み重ねることで、社内の心理的障壁を取り除いていきました。','具体的には、カスタマーサポートのAIアシスト機能から始め、対応時間を平均40%削減することに成功しました。']},
      {type:'section',text:'技術的負債との戦い'},
      {type:'p',sentences:['技術的負債は、多くの成長企業が直面する共通の課題です。','私たちの場合、新機能開発と技術的負債の解消を70:30の比率でリソースを配分するルールを設けました。','この原則を守ることで、開発速度を落とさずに、システムの健全性を維持することができています。']},
      {type:'section',text:'これからの採用について'},
      {type:'p',sentences:['私たちが求めているのは、技術力だけでなく、ビジネス視点を持ったエンジニアです。','コードを書く能力はもちろん重要ですが、それと同じくらい、なぜそのシステムが必要なのかを理解できる人材を重視しています。','転職を考えているエンジニアへのアドバイスとしては、まず自分が解決したい問題を明確にすることが大切です。','会社選びは、技術スタックよりも、その会社が取り組む課題と自分の志向が合致しているかで判断してほしいと思います。']},
    ]
  },
  {
    id:2, tag:'業界分析', badgeClass:'badge-analysis',
    title:'2024年フィンテック業界の動向：規制強化とオープンバンキングの行方',
    subtitle:'金融とテクノロジーの交差点で起きている変化を徹底解説',
    meta:{source:'FinTech Japan Insight', date:'2024年2月', readTime:'約6分'},
    vocab:[
      {jp:'オープンバンキング', reading:'おーぷんばんきんぐ', def:'銀行がAPIで金融データを第三者に開放する仕組み'},
      {jp:'KYC', reading:'ケーワイシー', def:'Know Your Customer。本人確認や与信審査プロセス'},
      {jp:'RegTech', reading:'レグテック', def:'Regulatory Technology。規制遵守をテクノロジーで効率化する分野'},
    ],
    sections:['市場概況','規制動向','ビジネス機会'],
    content:[
      {type:'section',text:'2024年のフィンテック市場概況'},
      {type:'p',sentences:['日本のフィンテック市場は、2024年に大きな転換点を迎えようとしています。','デジタル庁の設立以降、行政手続きのデジタル化が加速し、金融サービスとの連携が深まっています。','特に、マイナンバーとの連携強化により、KYCプロセスが大幅に簡素化される見通しです。']},
      {type:'section',text:'規制強化とオープンバンキング'},
      {type:'p',sentences:['金融庁は2024年、オープンバンキングに関する新たなガイドラインを公表しました。','これにより、銀行はAPIの提供を義務化され、フィンテック企業との連携が制度的に保証されることになります。','一方で、セキュリティ要件の厳格化により、小規模なフィンテックスタートアップには参入障壁が高まる可能性もあります。']},
      {type:'section',text:'ビジネス機会としてのRegTech'},
      {type:'p',sentences:['RegTech分野は、規制対応コストの増大を背景に、急速に成長しています。','特にAIを活用したマネーロンダリング対策（AML）ソリューションへの需要が高まっています。','転職市場においても、金融規制の知識とテクノロジースキルを兼ね備えた人材の希少性が増しています。']},
    ]
  },
  {
    id:3, tag:'ニュース', badgeClass:'badge-news',
    title:'ソフトバンクとOpenAIが日本でAI共同事業を発表',
    subtitle:'国内のAI産業に与える影響と今後の展開を分析',
    meta:{source:'日経テクノロジー', date:'2024年3月', readTime:'約4分'},
    vocab:[
      {jp:'ジョイントベンチャー', reading:'じょいんとべんちゃー', def:'二社以上が共同で設立・運営する合弁事業体'},
      {jp:'エコシステム', reading:'えこしすてむ', def:'企業・技術・ユーザーが相互に依存して形成する生態系的な環境'},
      {jp:'GPU', reading:'ジーピーユー', def:'画像処理に特化した半導体。AI学習に不可欠なインフラ'},
    ],
    sections:['発表内容','業界への影響','今後の展開'],
    content:[
      {type:'section',text:'共同事業の発表内容'},
      {type:'p',sentences:['ソフトバンクとOpenAIは、日本市場向けのAIサービスを共同展開すると発表しました。','投資規模は500億円規模とされ、日本国内のAIインフラ整備が主な目的となっています。','特に、GPU不足が指摘される中、データセンターへの大規模投資が注目を集めています。']},
      {type:'section',text:'業界への影響'},
      {type:'p',sentences:['この提携により、日本企業がエンタープライズ向けのOpenAI技術にアクセスしやすくなると期待されています。','競合他社のGoogleやAmazonも日本市場でのAI投資を加速させており、競争が激化しています。','人材獲得競争も激しくなり、AIエンジニアの年収は引き続き上昇傾向にあります。']},
      {type:'section',text:'今後の展開'},
      {type:'p',sentences:['アナリストは、この提携が日本のAIエコシステム全体を底上げする可能性を指摘しています。','特に、医療・教育・行政分野でのAI活用が加速すると見られています。','転職を考えるエンジニアにとって、AIと業界知識を掛け合わせたスキルセットが、今後ますます価値を持つでしょう。']},
    ]
  }
];

// ===== STATE =====
let currentArticle=null, sentences=[], currentSentence=-1, isPlaying=false, playSpeed=1, chatMode='qa', chatHistory=[];
let apiKey = localStorage.getItem('anthropic_key') || '';

// ===== INIT =====
function init() {
  if (apiKey) { document.getElementById('api-key-input').value = apiKey; showKeySaved(); }
  renderArticleList();
  if ('speechSynthesis' in window) document.getElementById('tts-label').textContent = '音声読み上げ ✓';
}

function saveKey() {
  apiKey = document.getElementById('api-key-input').value.trim();
  localStorage.setItem('anthropic_key', apiKey);
  showKeySaved();
}
function showKeySaved() {
  document.getElementById('key-status').style.display = 'inline';
  setTimeout(() => document.getElementById('key-status').style.display = 'none', 2000);
}

function renderArticleList() {
  document.getElementById('article-list').innerHTML = ARTICLES.map(a => `
    <div class="article-item" onclick="loadArticle(${a.id})" id="art-${a.id}">
      <div><span class="article-badge ${a.badgeClass}">${a.tag}</span></div>
      <div class="article-item-title">${a.title}</div>
      <div class="article-item-meta">${a.meta.source} · ${a.meta.readTime}</div>
    </div>`).join('');
}

function loadArticle(id) {
  ttsStop(); currentArticle=ARTICLES.find(a=>a.id===id); sentences=[]; currentSentence=-1; isPlaying=false; chatHistory=[];
  document.querySelectorAll('.article-item').forEach(el=>el.classList.remove('active'));
  document.getElementById(`art-${id}`).classList.add('active');
  document.getElementById('article-tag').textContent='📰 '+currentArticle.tag;
  document.getElementById('article-title').textContent=currentArticle.title;
  document.getElementById('article-subtitle').textContent=currentArticle.subtitle;
  document.getElementById('article-meta').innerHTML=`<span>📡 ${currentArticle.meta.source}</span><span>📅 ${currentArticle.meta.date}</span><span>⏱ ${currentArticle.meta.readTime}</span>`;
  renderVocab(currentArticle.vocab);
  renderArticleBody(currentArticle.content);
  renderSectionNav(currentArticle.sections);
  updateProgress();
  addChatMsg('ai',`「${currentArticle.title}」を読み込みました。▶で音声再生開始。文をクリックするとその箇所から再生できます。`);
}

function renderVocab(vocab) {
  document.getElementById('vocab-panel').style.display='block';
  document.getElementById('vocab-items').innerHTML=vocab.map(v=>`
    <div class="vocab-item"><span class="vocab-jp">${v.jp}</span><span class="vocab-reading">【${v.reading}】</span><span class="vocab-def">${v.def}</span></div>`).join('');
}

function renderArticleBody(content) {
  let si=0;
  document.getElementById('article-body').innerHTML=content.map(block=>{
    if(block.type==='section') return `<div class="section-header">${block.text}</div>`;
    const p=block.sentences.map(s=>{const i=si++;sentences.push({idx:i,text:s});return `<span class="sentence" id="s${i}" onclick="jumpToSentence(${i})">${s}</span>`;}).join('');
    return `<p>${p}</p>`;
  }).join('');
  document.getElementById('progress').max=Math.max(sentences.length-1,1);
  document.getElementById('time-total').textContent=`全${sentences.length}文`;
}

function renderSectionNav(sections) {
  document.getElementById('section-nav').innerHTML=sections.map((s,i)=>`<span class="section-chip" onclick="jumpToSection(${i})">${s}</span>`).join('');
}

// ===== TTS =====
function ttsStop(){window.speechSynthesis?.cancel();document.getElementById('tts-dot').classList.remove('active');}
function ttsSpeak(text,onEnd){
  ttsStop();
  if(!('speechSynthesis' in window))return;
  const utt=new SpeechSynthesisUtterance(text);
  utt.lang='ja-JP';utt.rate=playSpeed;
  const jp=window.speechSynthesis.getVoices().find(v=>v.lang.startsWith('ja'));
  if(jp)utt.voice=jp;
  document.getElementById('tts-dot').classList.add('active');
  utt.onend=()=>{document.getElementById('tts-dot').classList.remove('active');if(onEnd)onEnd();};
  utt.onerror=()=>document.getElementById('tts-dot').classList.remove('active');
  window.speechSynthesis.speak(utt);
}

// ===== PLAYER =====
function togglePlay(){
  if(!currentArticle){addChatMsg('ai','先に記事を選んでください。');return;}
  if(isPlaying){isPlaying=false;ttsStop();document.getElementById('play-btn').textContent='▶';}
  else{isPlaying=true;document.getElementById('play-btn').textContent='⏸';if(currentSentence<0)currentSentence=0;playCurrent();}
}
function playCurrent(){
  if(!isPlaying||currentSentence>=sentences.length){isPlaying=false;document.getElementById('play-btn').textContent='▶';return;}
  highlightSentence(currentSentence);updateProgress();
  ttsSpeak(sentences[currentSentence].text,()=>{if(isPlaying){markRead(currentSentence);currentSentence++;playCurrent();}});
}
function highlightSentence(idx){
  document.querySelectorAll('.sentence').forEach(el=>el.classList.remove('reading'));
  const el=document.getElementById(`s${idx}`);
  if(el){el.classList.add('reading');el.scrollIntoView({behavior:'smooth',block:'center'});}
}
function markRead(idx){const el=document.getElementById(`s${idx}`);if(el){el.classList.remove('reading');el.classList.add('read');}}
function jumpToSentence(idx){
  if(!currentArticle)return;currentSentence=idx;
  if(isPlaying){ttsStop();playCurrent();}
  else{document.querySelectorAll('.sentence').forEach(el=>el.classList.remove('selected','reading'));const el=document.getElementById(`s${idx}`);if(el){el.classList.add('selected');el.scrollIntoView({behavior:'smooth',block:'center'});}}
  updateProgress();
}
function jumpToSection(si){
  if(!currentArticle)return;let cum=0,target=0,sc=0;
  for(const b of currentArticle.content){if(b.type==='section'){if(sc===si)break;sc++;}else if(b.type==='p'){if(sc<=si)target=cum;cum+=b.sentences.length;}}
  jumpToSentence(target);
  document.querySelectorAll('.section-chip').forEach((el,i)=>el.classList.toggle('active',i===si));
}
function prevSentence(){if(currentSentence>0)jumpToSentence(currentSentence-1);}
function nextSentence(){if(currentArticle&&currentSentence<sentences.length-1)jumpToSentence(currentSentence+1);}
function seekTo(val){const idx=parseInt(val);if(!isNaN(idx))jumpToSentence(idx);}
function setSpeed(s){playSpeed=s;document.querySelectorAll('.speed-btn').forEach(b=>b.classList.toggle('active',parseFloat(b.dataset.speed)===s));}
function updateProgress(){
  const total=sentences.length||1,cur=Math.max(currentSentence,0),pct=(cur/(total-1))*100;
  const bar=document.getElementById('progress');bar.value=cur;bar.style.setProperty('--pct',pct+'%');
  document.getElementById('time-current').textContent=`${cur+(currentSentence>=0?1:0)} / ${total} 文`;
}

// ===== CHAT =====
function setChatMode(m){
  chatMode=m;document.querySelectorAll('.chat-mode-btn').forEach(b=>b.classList.remove('active'));document.getElementById(`cm-${m}`).classList.add('active');
  const ri=document.getElementById('role-info');
  if(m==='roleplay'){ri.style.display='block';ri.textContent='🎭 面接官として質問します。転職希望者として答えてください。';addChatMsg('ai','では面接を始めます。本日はお越しいただきありがとうございます。まず、今回の転職理由をお聞かせください。');}
  else if(m==='explain'){ri.style.display='block';ri.textContent='📚 気になる文をクリックするか、わからない箇所を質問してください。';addChatMsg('ai','どの部分を詳しく解説しましょうか？');}
  else{ri.style.display='none';addChatMsg('ai','Q&Aモードです。記事の内容について何でも質問してください。');}
}
function addChatMsg(role,text){
  const msgs=document.getElementById('chat-messages');
  const div=document.createElement('div');div.className=`msg ${role}`;
  div.innerHTML=`<div class="msg-role">${role==='ai'?'AI アシスタント':'あなた'}</div><div class="msg-bubble">${text.replace(/\n/g,'<br>')}</div>`;
  msgs.appendChild(div);msgs.scrollTop=msgs.scrollHeight;return div;
}
function addLoadingMsg(){
  const msgs=document.getElementById('chat-messages');
  const div=document.createElement('div');div.className='msg ai';
  div.innerHTML=`<div class="msg-role">AI アシスタント</div><div class="msg-bubble loading-dots">考え中</div>`;
  msgs.appendChild(div);msgs.scrollTop=msgs.scrollHeight;return div;
}
function buildSystemPrompt(){
  const ctx=currentArticle?`\n現在の記事：「${currentArticle.title}」\n内容：${sentences.map(s=>s.text).join('　')}\nキーワード：${currentArticle.vocab.map(v=>`${v.jp}（${v.def}）`).join('、')}`:'記事未選択。';
  if(chatMode==='roleplay')return`あなたは日本の${currentArticle?.tag||'テック'}企業の面接官です。${ctx}\nユーザーは転職希望者です。記事の内容をふまえ、業界知識・論理的思考・志望動機を面接形式で確認してください。日本語で話してください。`;
  if(chatMode==='explain')return`あなたは日本語・ビジネス用語の専門家です。${ctx}\nユーザーが記事の言葉や概念を質問します。平易な日本語で説明し、必要に応じて中国語での補足も加えてください。`;
  return`あなたは転職活動サポートAIです。${ctx}\n記事の内容を深掘りし、転職・業界理解に役立つ情報を提供してください。日本語で答え、必要に応じて中国語でも補足してください。`;
}
async function sendMessage(){
  const input=document.getElementById('chat-input'),text=input.value.trim();
  if(!text)return;
  if(!apiKey){addChatMsg('ai','上のバーにAPI Keyを入力してください。');return;}
  input.value='';autoResize(input);
  addChatMsg('user',text);chatHistory.push({role:'user',content:text});
  const ld=addLoadingMsg();document.getElementById('send-btn').disabled=true;
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system:buildSystemPrompt(),messages:chatHistory.slice(-10)})
    });
    const data=await res.json();
    const reply=data.content?.[0]?.text||'エラーが発生しました。';
    ld.remove();addChatMsg('ai',reply);chatHistory.push({role:'assistant',content:reply});
  }catch(e){ld.remove();addChatMsg('ai','エラーが発生しました。API Keyを確認してください。');}
  document.getElementById('send-btn').disabled=false;
}
function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}}
function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px';}
window.speechSynthesis && (window.speechSynthesis.onvoiceschanged=()=>{});
init();
</script>
</body>
